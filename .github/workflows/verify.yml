name: Verify learning examples

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  c:
    name: C
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S C -B build/c
      - name: Compile
        run: cmake --build build/c
      - name: Test examples
        run: ctest --test-dir build/c --output-on-failure

  java:
    name: Java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: Java/pom.xml
      - name: Compile and test
        run: mvn --batch-mode --file Java/pom.xml verify

  spring:
    name: Spring Boot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: Spring/ProductExample/pom.xml
      - name: Compile and test
        run: mvn --batch-mode --file Spring/ProductExample/pom.xml verify

  scala:
    name: Scala
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: sbt/setup-sbt@v1
      - name: Compile and test
        working-directory: Scala
        run: sbt --batch test

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Python/requirements/numpy.txt
      - name: Install pinned dependencies
        run: python -m pip install --requirement Python/requirements/numpy.txt
      - name: Run standard-library tests
        run: python -m unittest discover -s Python/tests -v
      - name: Run NumPy lessons
        shell: bash
        run: for lesson in Python/numpy/*.py; do python "$lesson"; done

  lean:
    name: Lean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false

  coq:
    name: Coq
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Coq
        run: sudo apt-get update && sudo apt-get install --yes coq
      - name: Generate Makefile
        run: coq_makefile -f _CoqProject -o CoqMakefile
      - name: Compile project
        run: make -f CoqMakefile

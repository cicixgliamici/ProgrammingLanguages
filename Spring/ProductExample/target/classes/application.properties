# Server Configuration
# Defines the port where the application will run
server.port=8080

# H2 Database Configuration
# In-memory database configuration for development purposes
# URL format: jdbc:h2:mem:productdb (mem indicates in-memory database)
spring.datasource.url=jdbc:h2:mem:productdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Console
# Enables the H2 web console for database management
# Accessible at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
# update: Automatically updates the database schema based on entity changes
# show-sql: Displays SQL queries in the console
# format_sql: Makes SQL queries more readable in the console
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
# Sets logging levels for different packages
# INFO: General Spring framework logs
# DEBUG: Detailed logs for our application package
logging.level.org.springframework=INFO
logging.level.com.example.product=DEBUG 